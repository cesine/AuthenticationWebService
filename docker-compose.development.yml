version: '2'
services:
    db:
        ports:
          - "5984:5984"
    backend:
        build: ./backend
        working_dir: /backend
        command: npm run develop
        volumes:
            - ./backend:/backend
            - ./backend/media:/media
        ports:
            - "8000:8000"
        environment:
            NODE_ENV: development
        depends_on:
            - db
